name: Refresh vendor snapshot

# Regenerates assets/data/vendors.json from the private Foodzoid API and
# commits it back. The live API is never called from the browser; the site
# only ever reads this committed JSON snapshot.

on:
  # Daily at 02:30 UTC (08:00 IST)
  schedule:
    - cron: '30 2 * * *'
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-vendors
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate vendor snapshot
        env:
          # Optional override; defaults to the public API base in the script.
          FOODZOID_API_BASE: ${{ secrets.FOODZOID_API_BASE }}
        run: node scripts/fetch-vendors.mjs

      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- assets/data/vendors.json; then
            echo "No changes to vendor snapshot."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/vendors.json
          git commit -m "chore: refresh vendor snapshot [skip ci]"
          git push
